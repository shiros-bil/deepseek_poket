<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>DeepSeek Pocket</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><script>try{const p=JSON.parse(localStorage.getItem('pocket-ui')||'{}');document.documentElement.dataset.theme=p.theme==='light'?'light':'dark';document.documentElement.lang=p.language==='ru'?'ru':'en';}catch(e){}</script></head>
<body>
<header><a class="brand" href="#home" data-i18n-aria-label="home"><span class="brand-mark"><span class="icon" data-icon="deepseek"></span></span><span>deepseek<span class="brand-light"> / pocket</span></span></a><span class="version">1.3.3</span></header>
<main>
<section id="page-home" class="page active">
 <h1 data-i18n="home"></h1>
 <div class="server-card">
  <div class="server-top"><span id="serverBadge" class="badge"><i></i><span data-i18n="stopped"></span></span><span class="mono small">LOCAL / 01</span></div>
  <div class="server-title"><span id="serverTitle" data-i18n="readyTitle"></span></div>
  <p id="serverDescription" data-i18n="noAccountDescription"></p>
  <button id="powerButton" class="power-btn" onclick="toggleServer()"><span class="icon" data-icon="power"></span><span id="powerLabel" data-i18n="start"></span></button>
 </div>
 <div class="stats"><div><span class="stat-value" id="statAccounts">00</span><span class="stat-label" data-i18n="accountsCaps"></span></div><div><span class="stat-value" id="statSessions">—</span><span class="stat-label" data-i18n="sessionsCaps"></span></div><div><span class="stat-value" id="statFlight">—</span><span class="stat-label" data-i18n="requests"></span></div></div>
 <div class="section-head"><h2 data-i18n="connection"></h2><span class="pill" id="networkType" data-i18n="phoneOnly"></span></div>
 <div class="panel endpoint" onclick="copyEndpoint()" role="button" tabindex="0" onkeydown="if(event.key==='Enter')copyEndpoint()"><span class="eyebrow">OPENAI BASE URL</span><div class="endpoint-line"><code id="endpoint">http://127.0.0.1:9655/v1</code><button class="icon-button" data-i18n-aria-label="copyAddress" onclick="event.stopPropagation();copyEndpoint()"><span class="icon" data-icon="copy"></span></button></div><div class="key-row" id="overviewKey" hidden><span data-i18n="apiKey"></span><code>•••• •••• •••• ••••</code><button class="text-button" onclick="event.stopPropagation();copyKey()" data-i18n="copy"></button></div><div id="lanAddresses" class="subtext"></div></div>
 <div class="panel public-card"><div class="section-head"><h2 data-i18n="publicApi"></h2><span id="tunnelStatus" class="pill"></span></div><code id="publicEndpoint"></code><p class="micro" id="tunnelHint"></p><div class="two-buttons"><button class="secondary" id="tunnelToggle" onclick="toggleTunnel()"></button><button class="secondary" id="copyPublic" onclick="copyPublicEndpoint()" data-i18n="copyAddress"></button></div><button class="text-button" onclick="navigate('settings')" data-i18n="settings"></button></div>
 <div id="batteryTip" class="notice" hidden><span class="icon" data-icon="moon"></span><div><strong data-i18n="backgroundTitle"></strong><p data-i18n="backgroundTip"></p><button class="text-button inline-link" onclick="act('battery')"><span data-i18n="openSettings"></span><span class="icon" data-icon="arrow-up-right"></span></button></div></div>
 <div class="section-head"><h2 data-i18n="protocolsTitle"></h2><span class="mono small">03</span></div>
 <div class="protocols"><div><span class="protocol-index">01</span><div><b>OpenAI</b><code>/v1/chat/completions</code></div></div><div><span class="protocol-index">02</span><div><b>Anthropic</b><code>/v1/messages</code></div></div><div><span class="protocol-index">03</span><div><b>Responses</b><code>/v1/responses</code></div></div></div>
 <button class="wide-link" onclick="showModels()"><span data-i18n="models"></span><span class="icon" data-icon="arrow-up-right"></span></button>
</section>
<section id="page-accounts" class="page">
 <h1 data-i18n="accounts"></h1><p class="intro" data-i18n="accountsIntro"></p>
 <div id="accountsList"></div>
 <button class="primary full" onclick="act('login')"><span class="icon" data-icon="plus"></span><span data-i18n="login"></span><span class="icon trailing" data-icon="arrow-up-right"></span></button>
 <div class="two-buttons"><button class="secondary" onclick="act('pickAccount')" data-i18n="importFile"></button><button class="secondary" onclick="openImport()" data-i18n="pasteJson"></button></div>
 <div class="note"><span class="eyebrow" data-i18n="howConnect"></span><ol><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li></ol><p data-i18n="importHelp"></p></div>
</section>
<section id="page-chat" class="page">
 <div class="section-head"><div><h1 class="chat-heading" data-i18n="chat"></h1></div><button class="icon-button" data-i18n-aria-label="newChat" onclick="newChat()"><span class="icon" data-icon="plus"></span></button></div>
 <label class="field model-field"><span data-i18n="chooseModel"></span><span class="select-wrap"><select id="chatModel" onchange="modelChanged()"><option value="deepseek-v4.1-flash" data-i18n="flash"></option><option value="deepseek-v4.1-flash-thinking" data-i18n="thinking"></option></select><span class="icon" data-icon="chevron-down"></span></span></label>
 <div class="chat-options"><span class="search-status"><span class="icon" data-icon="search"></span><span data-i18n="searchOn"></span></span><span class="mono small">SSE</span></div>
 <div id="chatMessages"></div><div id="chatActions" hidden><button id="regenerateButton" class="secondary inline-link" onclick="regenerateChat()"><span class="icon" data-icon="rotate-ccw"></span><span data-i18n="regenerate"></span></button></div><div id="attachments"></div>
 <div class="composer"><textarea id="prompt" rows="2" data-i18n-placeholder="writeMessage" data-i18n-aria-label="message"></textarea><div class="composer-bottom"><button class="icon-button" data-i18n-aria-label="attachImage" onclick="act('pickImage')"><span class="icon" data-icon="image"></span></button><span class="subtext" id="chatHint">V4.1 Flash</span><button id="sendButton" class="send-button" data-i18n-aria-label="send" onclick="sendChat()"><span class="icon" data-icon="arrow-up"></span></button></div></div>
 <p class="micro" data-i18n="chatRequirement"></p>
</section>
<section id="page-activity" class="page">
 <h1 data-i18n="logs"></h1>
 <div class="segmented"><button class="selected" onclick="activityTab('sessions',this)" data-i18n="sessions"></button><button onclick="activityTab('logs',this)" data-i18n="logs"></button><button onclick="activityTab('diagnose',this)" data-i18n="diagnostics"></button></div><div id="activityContent"></div>
</section>
<section id="page-settings" class="page">
 <h1 data-i18n="settings"></h1>
 <div class="panel form-panel appearance-panel"><div class="eyebrow" data-i18n="appearance"></div>
  <label class="field"><span class="label-icon"><span class="icon" data-icon="globe"></span><span data-i18n="language"></span></span><span class="select-wrap"><select id="settingLanguage" onchange="changePreferences()"><option value="en">English</option><option value="ru">Русский</option></select><span class="icon" data-icon="chevron-down"></span></span></label>
  <label class="field"><span class="label-icon"><span class="icon" data-icon="moon"></span><span data-i18n="theme"></span></span><span class="select-wrap"><select id="settingTheme" onchange="changePreferences()"><option value="dark" data-i18n="dark"></option><option value="light" data-i18n="light"></option></select><span class="icon" data-icon="chevron-down"></span></span></label><p class="micro" data-i18n="appearanceHint"></p>
 </div>
 <div id="settingsLock" class="notice"><span data-i18n="stopToConfigure"></span><button class="secondary" onclick="stopForSettings()" data-i18n="stop"></button></div>
 <form id="settingsForm" onsubmit="saveSettings(event)"><fieldset id="serverSettings">
 <div class="panel form-panel" id="publicSettings"><div class="eyebrow" data-i18n="publicApi"></div>
 <label class="switch-row"><span><b data-i18n="enablePublic"></b><small data-i18n="publicHelp"></small></span><input id="settingPublic" type="checkbox" role="switch" onchange="updateTunnelSettings()"></label>
 <div id="tunnelSettings" hidden><label class="field"><span data-i18n="tunnelMode"></span><select id="settingTunnelMode" onchange="updateTunnelSettings()"><option value="quick" data-i18n="quickTunnel"></option><option value="named" data-i18n="namedTunnel"></option></select></label>
 <p class="micro" id="quickHint" data-i18n="quickHelp"></p>
 <div id="namedSettings" hidden><label class="field"><span data-i18n="tunnelToken"></span><input id="settingTunnelToken" type="password" autocomplete="new-password" data-i18n-placeholder="keepKey"></label><label class="field"><span data-i18n="publicHostname"></span><input id="settingPublicUrl" type="url" placeholder="https://api.example.com"></label><p class="micro" id="namedHint"></p></div>
 <label class="switch-row"><span><b data-i18n="allowWebsites"></b></span><input id="settingAnyOrigin" type="checkbox" role="switch" onchange="updateTunnelSettings()"></label><label class="field" id="originSettings"><span data-i18n="allowedOrigins"></span><textarea id="settingOrigins" rows="3" placeholder="https://example.com"></textarea></label><p class="micro" data-i18n="publicNoKey"></p></div></div>
 <div class="panel form-panel history-panel"><div class="eyebrow" data-i18n="historySettings"></div>
  <label class="switch-row"><span><b data-i18n="sendFullHistory"></b><small data-i18n="sendFullHistoryHelp"></small></span><input id="settingFullHistory" type="checkbox" role="switch" onchange="historySettingsChanged(true)"></label>
  <div id="newChatSetting" class="history-dependent" hidden><label class="switch-row"><span><b data-i18n="newChatEachMessage"></b><small data-i18n="newChatEachMessageHelp"></small></span><input id="settingNewChat" type="checkbox" role="switch" onchange="historySettingsChanged(false)"></label></div>
  <div id="historyWarning" class="history-warning" role="note" hidden><strong data-i18n="historyWarningTitle"></strong><p data-i18n="historyWarningText"></p></div>
  <p class="micro" data-i18n="historyApply"></p>
 </div>
 <div class="panel form-panel"><div class="eyebrow" data-i18n="network"></div><label class="field"><span data-i18n="serverPort"></span><input id="settingPort" type="number" min="1024" max="65535" required></label><label class="switch-row"><span><b data-i18n="lanTitle"></b><small data-i18n="lanHelp"></small></span><input id="settingLan" type="checkbox" role="switch"></label><p class="micro" data-i18n="lanWarning"></p><label class="field"><span data-i18n="customKey"></span><input id="settingKey" type="password" data-i18n-placeholder="keepKey" autocomplete="new-password"></label><button type="button" class="text-button" onclick="removeKey()" data-i18n="removeKey"></button><p class="micro" id="keyStatus"></p></div>
 <div class="panel form-panel"><div class="eyebrow" data-i18n="background"></div><label class="switch-row"><span><b data-i18n="keepAlive"></b><small data-i18n="keepAliveHelp"></small></span><input id="settingWake" type="checkbox" role="switch"></label><label class="switch-row"><span><b data-i18n="boot"></b><small data-i18n="bootHelp"></small></span><input id="settingBoot" type="checkbox" role="switch"></label><button type="button" class="wide-link" onclick="act('battery')"><span data-i18n="battery"></span><span class="icon" data-icon="arrow-up-right"></span></button><p class="micro" data-i18n="backgroundHelp"></p></div>
 <details class="panel advanced"><summary><span data-i18n="advanced"></span><span class="icon" data-icon="plus"></span></summary><p class="micro" data-i18n="advancedHelp"></p><textarea id="settingEnv" rows="9" spellcheck="false" placeholder="DEEPSEEK_MAX_CONCURRENT=4&#10;DEEPSEEK_MAX_PROMPT_CHARS=80000&#10;DEEPSEEK_STREAM_MAX_MS=600000"></textarea></details>
 <button class="primary full" type="submit"><span data-i18n="saveSettings"></span><span class="icon trailing" data-icon="arrow-up-right"></span></button></fieldset></form>
</section></main>
<nav data-i18n-aria-label="home"><button class="active" data-page="home" onclick="navigate('home')"><span class="icon" data-icon="layout-dashboard"></span><span data-i18n="home"></span></button><button data-page="accounts" onclick="navigate('accounts')"><span class="icon" data-icon="users"></span><span data-i18n="accounts"></span></button><button data-page="chat" onclick="navigate('chat')"><span class="icon" data-icon="message-circle"></span><span data-i18n="chat"></span></button><button data-page="activity" onclick="navigate('activity')"><span class="icon" data-icon="terminal"></span><span data-i18n="activity"></span></button><button data-page="settings" onclick="navigate('settings')"><span class="icon" data-icon="sliders-horizontal"></span><span data-i18n="settings"></span></button></nav>
<div id="toast" role="status"></div>
<dialog id="importDialog"><div class="section-head"><h2 data-i18n="importAccount"></h2><button class="icon-button" onclick="this.closest('dialog').close()" data-i18n-aria-label="close"><span class="icon" data-icon="x"></span></button></div><label class="field"><span data-i18n="name"></span><input id="importName" data-i18n-placeholder="namePlaceholder"></label><label class="field"><span data-i18n="authJson"></span><textarea id="importRaw" rows="6" spellcheck="false" placeholder='{"token":"…","cookie":"…"}'></textarea></label><label class="field"><span data-i18n="cookieToken"></span><input id="importToken" type="password" data-i18n-placeholder="tokenPlaceholder" autocomplete="off"></label><button class="primary full" onclick="importAccount()"><span data-i18n="addAccount"></span><span class="icon trailing" data-icon="arrow-up-right"></span></button></dialog>
<dialog id="unsavedDialog"><h2 data-i18n="unsavedTitle"></h2><p data-i18n="unsavedText"></p><button class="primary full" id="applyChanges" data-i18n="apply"></button><button class="secondary full" id="discardChanges" data-i18n="discard"></button><button class="text-button full" id="staySettings" data-i18n="cancel"></button></dialog>
<dialog id="modelsDialog"><div class="section-head"><h2 data-i18n="models"></h2><button class="icon-button" onclick="this.closest('dialog').close()" data-i18n-aria-label="close"><span class="icon" data-icon="x"></span></button></div><div id="modelsContent"></div></dialog>
<script src="icons.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
